appId: YourAppID
productName: MHAtomExcelTool
asar: true
# 将 MCP Server 及其依赖的本地模块排除出 asar，
# 使打包后仍可通过 node 子进程方式运行 McpServer.js
# 这些文件会被释放到 app.asar.unpacked/ 目录下
asarUnpack:
  - dist/electron/mcp/**/*
  - dist/electron/main/**/*
  - dist/types/**/*
  - dist/constants/**/*
directories:
  buildResources: assets
  output: release/${version}
files:
  - dist
  - config
mac:
  artifactName: ${productName}_${version}.${ext}
  target:
    - dmg
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}_${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
# 在打包完成前清理多语言文件
afterPack: scripts/afterPack.js